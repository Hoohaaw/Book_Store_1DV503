<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Book</title>
    <link rel="stylesheet" href="../css/bookSearch.css">
</head>

<body>
    <div class="book-search-container">
        <h1>Search for a Book</h1>
        <form id="bookSearchForm">
            <div class="form-group">
            <label for="searchQuery">Select Subject</label>
            <input type="text" id="searchQuery" name="searchQuery" placeholder="Subject" required>
            <button type="submit" class="btn">Search</button>
            </div>

            <div class="form-group">
            <label for="searchQuery">Search by Author</label>
            <input type="text" id="searchQuery" name="searchQuery" placeholder="Author" required>
            <button type="submit" class="btn">Search</button>
            </div>

            <div class="form-group">
            <label for="searchQuery">Search by Title</label>
            <input type="text" id="searchQuery" name="searchQuery" placeholder="Title" required>
            <button type="submit" class="btn">Search</button>
            </div>

        </form>
        <div id="searchResults"></div>

    </div>
</body>
