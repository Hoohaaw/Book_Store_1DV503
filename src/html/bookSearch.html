<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Book</title>
    <link rel="stylesheet" href="../css/bookSearch.css">
</head>

<body>
    <div class="book-search-container">
        <h1>Search for a Book</h1>
        <form id="bookSearchForm">
            <div class="form-group">
              <label for="subjectInput">Select Subject</label>
              <input type="text" id="subjectInput" name="subject" placeholder="Subject">
            </div>
            <div class="form-group">
              <label for="authorInput">Search by Author</label>
              <input type="text" id="authorInput" name="author" placeholder="Author">
            </div>
            <div class="form-group">
              <label for="titleInput">Search by Title</label>
              <input type="text" id="titleInput" name="title" placeholder="Title">
            </div>
            <button type="submit" class="btn">Search</button>
        </form>
        <div id="searchResults"></div>
    </div>
    <script>
    document.getElementById('bookSearchForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const subject = document.getElementById('subjectInput').value;
      const author = document.getElementById('authorInput').value;
      const title = document.getElementById('titleInput').value;
      const res = await fetch(`/api/books/search?subject=${encodeURIComponent(subject)}&author=${encodeURIComponent(author)}&title=${encodeURIComponent(title)}`);
      const data = await res.json();
      const resultsDiv = document.getElementById('searchResults');
      if (!data || data.length === 0 || data.message) {
        resultsDiv.innerHTML = '<p>No books found.</p>';
      } else {
        resultsDiv.innerHTML = '<ul>' + data.map(book => `<li>${book.title} by ${book.author}</li>`).join('') + '</ul>';
      }
    });
    </script>
</body>
